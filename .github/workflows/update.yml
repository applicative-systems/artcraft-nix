name: Update inputs

on:
  schedule:
    - cron: "0 4 * * 1" # Mondays, 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - name: Refresh nix/tamal
        run: nix run .#update
      - uses: peter-evans/create-pull-request@v7
        id: pr
        with:
          branch: update-inputs
          delete-branch: true
          commit-message: "nix/tamal: update inputs"
          title: "Update inputs"
          body: Weekly `nix run .#update` (Nixtamal refresh of Nixpkgs and all app repos).
      - name: Build the PR
        if: steps.pr.outputs.pull-request-operation == 'created' || steps.pr.outputs.pull-request-operation == 'updated'
        run: gh workflow run cachix.yml --ref update-inputs
        env:
          GH_TOKEN: ${{ github.token }}
